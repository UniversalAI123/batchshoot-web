    <style>
      @font-face {
        font-family: 'Inter';
        src: url('/batchshoot-web/assets/fonts/inter-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
        font-style: normal;

      }
      @font-face {
        font-family: 'Instrument Serif';
        src: url('/batchshoot-web/assets/fonts/instrument-serif-latin-400-italic.woff2') format('woff2');
        font-weight: 400;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: 'Geist Mono';
        src: url('/batchshoot-web/assets/fonts/geist-mono-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }
      /* Bright (Nov 15 2026): the landing page's tokens. Light by default, dark when the reader's device is. */
      :root {
        color-scheme: light;
        --bg: #fbf8fc;
        --line: rgba(62, 40, 96, 0.1);
        --line-2: rgba(62, 40, 96, 0.14);
        --line-3: rgba(62, 40, 96, 0.3);
        --ink: #1c1622;
        --hi: #1c1622;
        --ink-2: #4a4153;
        --ink-3: #655b6e;
        --rec: #ee2f55;
        --rec-hi: #7a4dff;
        --rec-glow: rgba(238, 47, 85, 0.45);
        --grad-text: linear-gradient(135deg, #ff8a66 0%, #ee2f55 50%, #7a4dff 100%);
        --glow-a: rgba(255, 122, 92, 0.22);
        --glow-b: rgba(122, 77, 255, 0.2);
        --select: rgba(122, 77, 255, 0.22);
        --mark-shadow: rgba(90, 42, 122, 0.3);
        --btn-bg: linear-gradient(180deg, #30243a, #19141e);
        --btn-ink: #fff;
        --btn-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 16px 28px -14px rgba(122, 77, 255, 0.62), 0 9px 18px -10px rgba(238, 47, 85, 0.5);
        --sheen: rgba(255, 255, 255, 0.26);
        --ghost-bg: #fff;
        --ghost-shadow: inset 0 0 0 1px rgba(62, 40, 96, 0.14), 0 10px 20px -16px rgba(90, 42, 122, 0.35);
        --ghost-shadow-hover: inset 0 0 0 1px rgba(62, 40, 96, 0.26), 0 16px 30px -18px rgba(90, 42, 122, 0.45);
        --ghost-sheen: rgba(122, 77, 255, 0.1);
        --clip-shadow: rgba(90, 42, 122, 0.55);
        --scroll: #cfc4d8;
        --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
        --sans: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        --mono: 'Geist Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace;
        --serif: 'Instrument Serif', 'Iowan Old Style', Georgia, serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #0d0a11;
          --line: rgba(255, 255, 255, 0.085);
          --line-2: rgba(255, 255, 255, 0.15);
          --line-3: rgba(255, 255, 255, 0.26);
          --ink: #f8f4f6;
          --hi: #fff;
          --ink-2: #c9c0c8;
          --ink-3: #a39aa9;
          --rec-hi: #a48cff;
          --rec-glow: rgba(238, 47, 85, 0.8);
          --glow-a: rgba(255, 122, 92, 0.16);
          --glow-b: rgba(122, 77, 255, 0.24);
          --select: rgba(238, 47, 85, 0.45);
          --mark-shadow: rgba(122, 77, 255, 0.45);
          --btn-bg: linear-gradient(180deg, #ffffff, #f3ecf7);
          --btn-ink: #1c1622;
          --btn-shadow: inset 0 1px 0 #fff, 0 16px 28px -14px rgba(122, 77, 255, 0.62), 0 9px 18px -10px rgba(238, 47, 85, 0.5);
          --sheen: rgba(122, 77, 255, 0.2);
          --ghost-bg: linear-gradient(180deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.04));
          --ghost-shadow: inset 0 0 0 1px var(--line-2), inset 0 1px 0 rgba(255, 255, 255, 0.12);
          --ghost-shadow-hover: inset 0 0 0 1px var(--line-3), inset 0 1px 0 rgba(255, 255, 255, 0.16), 0 16px 30px -18px #000;
          --ghost-sheen: rgba(255, 255, 255, 0.16);
          --clip-shadow: transparent;
          --scroll: #3d3445;
        }
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        background: var(--bg);
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        scrollbar-color: var(--scroll) var(--bg);
        scrollbar-width: thin;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        grid-template-rows: auto 1fr;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        font-size: 17px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
        position: relative;
        isolation: isolate;
        overflow-x: hidden;
        overflow-x: clip;
      }
      body::before {
        content: '';
        position: fixed;
        inset: -20%;
        z-index: -1;
        pointer-events: none;
        background:
          radial-gradient(44% 38% at 14% 12%, var(--glow-a), transparent 70%),
          radial-gradient(44% 38% at 86% 88%, var(--glow-b), transparent 70%);
      }
      ::selection {
        background: var(--select);
        color: var(--hi);
      }
      a {
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--rec-hi);
        outline-offset: 3px;
        border-radius: 10px;
      }
      .wrap {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding-left: max(16px, env(safe-area-inset-left));
        padding-right: max(16px, env(safe-area-inset-right));
      }
      @media (min-width: 720px) {
        .wrap {
          padding-left: max(32px, env(safe-area-inset-left));
          padding-right: max(32px, env(safe-area-inset-right));
        }
      }
      header .wrap {
        display: flex;
        align-items: center;
        min-height: 68px;
        padding-top: env(safe-area-inset-top);
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 11px;
        min-height: 44px;
        text-decoration: none;
        font-weight: 720;
        font-size: 19px;
        letter-spacing: -0.035em;
        color: var(--hi);
      }
      .brand svg {
        border-radius: 8px;
        filter: drop-shadow(0 6px 14px var(--mark-shadow));
        transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      main {
        display: grid;
        align-content: center;
        padding: 32px 0 96px;
      }
      .kicker {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 22px;
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 560;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-3);
      }
      .kicker::before {
        content: '';
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--rec);
        box-shadow: 0 0 12px 1px var(--rec-glow);
        flex: none;
      }
      h1 {
        margin: 0 0 22px;
        font-size: clamp(46px, 9vw, 96px);
        font-weight: 780;
        letter-spacing: -0.052em;
        line-height: 0.95;
        color: var(--hi);
        text-wrap: balance;
      }
      h1 em {
        font-family: inherit;
        font-style: normal;
        font-weight: inherit;
        font-size: 1em;
        letter-spacing: inherit;
        background: var(--grad-text);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        -webkit-text-fill-color: transparent;
        padding-right: 0.08em;
      }
      .sub {
        margin: 0 0 32px;
        max-width: 26em;
        font-size: clamp(18px, 2.1vw, 21px);
        line-height: 1.4;
        letter-spacing: -0.015em;
        color: var(--ink-2);
        text-wrap: pretty;
      }
      .cta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      .btn {
        position: relative;
        overflow: hidden;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 54px;
        padding: 0 28px;
        border-radius: 999px;
        background: var(--btn-bg);
        color: var(--btn-ink);
        font-weight: 660;
        font-size: 16.5px;
        letter-spacing: -0.012em;
        text-decoration: none;
        white-space: nowrap;
        box-shadow: var(--btn-shadow);
        transition:
          transform 0.3s var(--ease),
          box-shadow 0.3s var(--ease);
      }
      .btn::after {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 42%;
        background: linear-gradient(90deg, transparent, var(--sheen), transparent);
        transform: translateX(-140%) skewX(-18deg);
        pointer-events: none;
      }
      .btn--ghost {
        background: var(--ghost-bg);
        color: var(--ink);
        box-shadow: var(--ghost-shadow);
      }
      .btn--ghost::after {
        background: linear-gradient(90deg, transparent, var(--ghost-sheen), transparent);
      }
      .btn:active {
        transform: scale(0.98);
      }
      @media (hover: hover) {
        .btn:hover {
          transform: translateY(-2px);
        }
        .btn--ghost:hover {
          box-shadow: var(--ghost-shadow-hover);
        }
        .brand:hover svg {
          transform: rotate(-8deg) scale(1.08);
        }
      }
      /* The strip of takes, with one slot empty: the page that is not here. */
      .strip {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: clamp(6px, 1.4vw, 12px);
        width: min(100%, 420px);
        margin: 0 0 36px;
        padding: 0;
        list-style: none;
      }
      .strip li {
        position: relative;
        aspect-ratio: 3 / 4;
        border-radius: clamp(8px, 1.6vw, 13px);
        background: linear-gradient(180deg, #30243a 0%, #19141e 100%);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.12),
          0 10px 18px -12px var(--clip-shadow);
      }
      .strip li::after {
        content: '';
        position: absolute;
        left: 13%;
        right: 13%;
        bottom: 11%;
        height: 7%;
        min-height: 4px;
        border-radius: 99px;
        background: linear-gradient(90deg, rgba(255, 255, 255, 0.88) 0 62%, #ffd43b 62% 100%);
      }
      .strip .gone {
        background: none;
        border: 1px dashed rgba(238, 47, 85, 0.6);
        box-shadow: none;
      }
      .strip .gone::after {
        display: none;
      }
      @keyframes arrive {
        from {
          opacity: 0;
          translate: 0 20px;
          filter: blur(10px);
        }
      }
      @keyframes clip-in {
        from {
          opacity: 0.2;
          scale: 0.92;
        }
      }
      @keyframes drift {
        0% {
          transform: translate3d(-3%, -2%, 0) scale(1);
        }
        50% {
          transform: translate3d(3%, 2%, 0) scale(1.08);
        }
        100% {
          transform: translate3d(-2%, 3%, 0) scale(1.02);
        }
      }
      @keyframes sheen-once {
        from {
          transform: translateX(-140%) skewX(-18deg);
        }
        to {
          transform: translateX(380%) skewX(-18deg);
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        body::before {
          animation: drift 26s var(--ease) infinite alternate;
        }
        header .brand,
        main .wrap > * {
          animation: arrive 0.8s var(--ease) backwards;
        }
        main .wrap > :nth-child(2) {
          animation-delay: 0.07s;
        }
        main .wrap > :nth-child(3) {
          animation-delay: 0.14s;
        }
        main .wrap > :nth-child(4) {
          animation-delay: 0.21s;
        }
        main .wrap > :nth-child(5) {
          animation-delay: 0.28s;
        }
        .strip li {
          animation: clip-in 0.6s var(--ease) backwards;
          animation-delay: calc(var(--i) * 0.1s + 0.35s);
        }
        @media (hover: hover) {
          .btn:hover::after {
            animation: sheen-once 0.85s var(--ease) both;
          }
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .btn,
        .brand svg {
          transition: none;
        }
      }
    </style>
  </head>
