<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      BatchShoot "page not found". Same Obsidian room as the landing page. Self-contained: no scripts,
      no third-party requests. GitHub Pages serves this file for any missing address under /batchshoot-web/,
      at any depth, so every link and font path here is absolute.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#08070b" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <title>Page not found · BatchShoot</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20120%20120'%3E%3Crect%20width='120'%20height='120'%20rx='27'%20fill='%23e5484d'/%3E%3Cg%20transform='rotate%28-14%2060%2064%29'%3E%3Crect%20x='34'%20y='26'%20width='46'%20height='72'%20rx='9'%20fill='%23b8323a'/%3E%3C/g%3E%3Cg%20transform='rotate%28-5%2060%2062%29'%3E%3Crect%20x='36'%20y='23'%20width='46'%20height='72'%20rx='9'%20fill='%23f2a3a6'/%3E%3C/g%3E%3Cg%20transform='rotate%286%2062%2058%29'%3E%3Crect%20x='40'%20y='20'%20width='48'%20height='74'%20rx='10'%20fill='%23fff'/%3E%3C/g%3E%3Cpath%20d='M58%2044%20L58%2070%20L80%2058%20Z'%20fill='%2315171b'/%3E%3C/svg%3E"
    />
    <link rel="icon" type="image/png" sizes="32x32" href="/batchshoot-web/assets/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/batchshoot-web/assets/apple-touch-icon.png" />
    <style>
      @font-face {
        font-family: 'Inter';
        src: url('/batchshoot-web/assets/fonts/inter-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Instrument Serif';
        src: url('/batchshoot-web/assets/fonts/instrument-serif-latin-400-italic.woff2') format('woff2');
        font-weight: 400;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: 'Geist Mono';
        src: url('/batchshoot-web/assets/fonts/geist-mono-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }
      :root {
        color-scheme: dark;
        --bg: #08070b;
        --line: rgba(255, 255, 255, 0.085);
        --line-2: rgba(255, 255, 255, 0.15);
        --line-3: rgba(255, 255, 255, 0.26);
        --ink: #f8f4f6;
        --ink-2: #c9c0c8;
        --ink-3: #a39aa9;
        --rec: #e5484d;
        --rec-hi: #ff6b70;
        --grad-text: linear-gradient(100deg, #ffd0a8 0%, #ff8f6b 30%, #ff5670 62%, #ff5f8f 100%);
        --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
        --sans: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        --mono: 'Geist Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace;
        --serif: 'Instrument Serif', 'Iowan Old Style', Georgia, serif;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        background: var(--bg);
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        scrollbar-color: #3d3445 var(--bg);
        scrollbar-width: thin;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        grid-template-rows: auto 1fr;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        font-size: 17px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
        position: relative;
        isolation: isolate;
        overflow-x: hidden;
        overflow-x: clip;
      }
      body::before {
        content: '';
        position: fixed;
        inset: -20%;
        z-index: -1;
        pointer-events: none;
        background:
          radial-gradient(38% 30% at 82% 12%, rgba(229, 72, 77, 0.22), transparent 70%),
          radial-gradient(34% 28% at 10% 34%, rgba(232, 35, 95, 0.11), transparent 72%),
          radial-gradient(46% 34% at 60% 94%, rgba(255, 144, 82, 0.09), transparent 70%);
      }
      ::selection {
        background: rgba(229, 72, 77, 0.45);
        color: #fff;
      }
      a {
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--rec-hi);
        outline-offset: 3px;
        border-radius: 10px;
      }
      .wrap {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding-left: max(16px, env(safe-area-inset-left));
        padding-right: max(16px, env(safe-area-inset-right));
      }
      @media (min-width: 720px) {
        .wrap {
          padding-left: max(32px, env(safe-area-inset-left));
          padding-right: max(32px, env(safe-area-inset-right));
        }
      }
      header .wrap {
        display: flex;
        align-items: center;
        min-height: 68px;
        padding-top: env(safe-area-inset-top);
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 11px;
        min-height: 44px;
        text-decoration: none;
        font-weight: 720;
        font-size: 19px;
        letter-spacing: -0.035em;
        color: #fff;
      }
      .brand svg {
        border-radius: 8px;
        filter: drop-shadow(0 6px 14px rgba(229, 72, 77, 0.5));
        transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      main {
        display: grid;
        align-content: center;
        padding: 32px 0 96px;
      }
      .kicker {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 22px;
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 560;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-3);
      }
      .kicker::before {
        content: '';
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--rec);
        box-shadow: 0 0 12px 1px rgba(229, 72, 77, 0.8);
        flex: none;
      }
      h1 {
        margin: 0 0 22px;
        font-size: clamp(46px, 9vw, 96px);
        font-weight: 780;
        letter-spacing: -0.052em;
        line-height: 0.95;
        color: #fff;
        text-wrap: balance;
      }
      h1 em {
        font-family: var(--serif);
        font-style: italic;
        font-weight: 400;
        font-size: 1.08em;
        letter-spacing: -0.025em;
        background: var(--grad-text);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        -webkit-text-fill-color: transparent;
        padding-right: 0.08em;
      }
      .sub {
        margin: 0 0 32px;
        max-width: 26em;
        font-size: clamp(18px, 2.1vw, 21px);
        line-height: 1.4;
        letter-spacing: -0.015em;
        color: var(--ink-2);
        text-wrap: pretty;
      }
      .cta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      .btn {
        position: relative;
        overflow: hidden;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 54px;
        padding: 0 28px;
        border-radius: 999px;
        background: linear-gradient(180deg, #d73d4c 0%, #cc3346 52%, #b8263b 100%);
        color: #fff;
        font-weight: 660;
        font-size: 16.5px;
        letter-spacing: -0.012em;
        text-decoration: none;
        white-space: nowrap;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.42),
          inset 0 -1px 0 rgba(0, 0, 0, 0.28),
          0 16px 36px -12px rgba(229, 72, 77, 0.75),
          0 2px 8px -2px rgba(229, 72, 77, 0.55);
        transition:
          transform 0.3s var(--ease),
          box-shadow 0.3s var(--ease);
      }
      .btn::after {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 42%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.34), transparent);
        transform: translateX(-140%) skewX(-18deg);
        pointer-events: none;
      }
      .btn--ghost {
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.04));
        color: var(--ink);
        box-shadow:
          inset 0 0 0 1px var(--line-2),
          inset 0 1px 0 rgba(255, 255, 255, 0.12);
      }
      .btn--ghost::after {
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.16), transparent);
      }
      .btn:active {
        transform: scale(0.98);
      }
      @media (hover: hover) {
        .btn:hover {
          transform: translateY(-2px);
        }
        .btn--ghost:hover {
          box-shadow:
            inset 0 0 0 1px var(--line-3),
            inset 0 1px 0 rgba(255, 255, 255, 0.16),
            0 16px 30px -18px #000;
        }
        .brand:hover svg {
          transform: rotate(-8deg) scale(1.08);
        }
      }
      /* The strip of takes, with one slot empty: the page that is not here. */
      .strip {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: clamp(6px, 1.4vw, 12px);
        width: min(100%, 420px);
        margin: 0 0 36px;
        padding: 0;
        list-style: none;
      }
      .strip li {
        position: relative;
        aspect-ratio: 3 / 4;
        border-radius: clamp(8px, 1.6vw, 13px);
        background: linear-gradient(165deg, #251e2c 0%, #17121d 55%, #100c15 100%);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.09);
      }
      .strip li::after {
        content: '';
        position: absolute;
        left: 13%;
        right: 13%;
        bottom: 11%;
        height: 7%;
        min-height: 4px;
        border-radius: 99px;
        background: linear-gradient(90deg, rgba(255, 255, 255, 0.88) 0 62%, #ffd43b 62% 100%);
      }
      .strip .gone {
        background: none;
        border: 1px dashed rgba(255, 120, 130, 0.55);
        box-shadow: none;
      }
      .strip .gone::after {
        display: none;
      }
      @keyframes arrive {
        from {
          opacity: 0;
          translate: 0 20px;
          filter: blur(10px);
        }
      }
      @keyframes clip-in {
        from {
          opacity: 0.2;
          scale: 0.92;
        }
      }
      @keyframes drift {
        0% {
          transform: translate3d(-3%, -2%, 0) scale(1);
        }
        50% {
          transform: translate3d(3%, 2%, 0) scale(1.08);
        }
        100% {
          transform: translate3d(-2%, 3%, 0) scale(1.02);
        }
      }
      @keyframes sheen-once {
        from {
          transform: translateX(-140%) skewX(-18deg);
        }
        to {
          transform: translateX(380%) skewX(-18deg);
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        body::before {
          animation: drift 26s var(--ease) infinite alternate;
        }
        header .brand,
        main .wrap > * {
          animation: arrive 0.8s var(--ease) backwards;
        }
        main .wrap > :nth-child(2) {
          animation-delay: 0.07s;
        }
        main .wrap > :nth-child(3) {
          animation-delay: 0.14s;
        }
        main .wrap > :nth-child(4) {
          animation-delay: 0.21s;
        }
        main .wrap > :nth-child(5) {
          animation-delay: 0.28s;
        }
        .strip li {
          animation: clip-in 0.6s var(--ease) backwards;
          animation-delay: calc(var(--i) * 0.1s + 0.35s);
        }
        @media (hover: hover) {
          .btn:hover::after {
            animation: sheen-once 0.85s var(--ease) both;
          }
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .btn,
        .brand svg {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap">
        <a class="brand" href="/batchshoot-web/" aria-label="BatchShoot home">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="30" height="30" aria-hidden="true" focusable="false"><rect width="120" height="120" rx="27" fill="#e5484d"/><g transform="rotate(-14 60 64)"><rect x="34" y="26" width="46" height="72" rx="9" fill="#b8323a"/></g><g transform="rotate(-5 60 62)"><rect x="36" y="23" width="46" height="72" rx="9" fill="#f2a3a6"/></g><g transform="rotate(6 62 58)"><rect x="40" y="20" width="48" height="74" rx="10" fill="#fff"/></g><path d="M58 44 L58 70 L80 58 Z" fill="#15171b"/></svg>
          <span>BatchShoot</span>
        </a>
      </div>
    </header>

    <main id="main">
      <div class="wrap">
        <p class="kicker">Error 404</p>
        <ul class="strip" aria-hidden="true">
          <li style="--i:0"></li>
          <li style="--i:1"></li>
          <li class="gone" style="--i:2"></li>
          <li style="--i:3"></li>
          <li style="--i:4"></li>
        </ul>
        <h1>This page <em>isn’t here.</em></h1>
        <p class="sub">The address may be mistyped, or the page may have moved.</p>
        <nav class="cta-row" aria-label="Where to go next">
          <a class="btn" href="/batchshoot-web/">BatchShoot home</a>
          <a class="btn btn--ghost" href="/batchshoot-web/support.html">Support</a>
          <a class="btn btn--ghost" href="/batchshoot-web/privacy.html">Privacy</a>
        </nav>
      </div>
    </main>
  </body>
</html>
